# tphome-linux's own bar settings. Loaded through the [include] in noctalia/00-hypeforge.toml (D-28).
# The bar is on all three screens again (Javier, 2026-10-01: "now that it is at the bottom,
# works better to me"); from 2026-09-30 it was on the middle screen, DP-3, only.

# Favourites on the taskbar, next to the launcher: the apps Javier pinned by right-clicking
# (2026-10-01), in his order. Noctalia saves right-click pins in its own file,
# ~/.local/state/noctalia/settings.toml, which wins over this one; this copy keeps them in the
# hypeForge folder, so they come back after a reinstall (D-8, D-28). Each name is the app's
# .desktop file.
[widget.taskbar]
pinned = [
  "Alacritty", "thunar", "google-chrome",
  "chrome-hnpfjngllnobngcgfapefoaidbinmjnm-Default",   # WhatsApp Web (Chrome web app)
  "onlyoffice-desktopeditors", "obsidian", "org.kde.elisa", "spotify", "org.kde.kcalc",
  "org.keepassxc.KeePassXC", "com.termius.Termius",
]
