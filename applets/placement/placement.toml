# hypeForge applet 2 · Window Placement (D-47, D-50)
#
# Every new window goes to the next free spot, in this order, in whatever workspace is on
# screen (counting everything visible on every screen, a shared screen included). Once every
# spot is taken, the next windows go round the same order again as TABS on those spots.
# Dialogs and floating windows are left alone.
#
# The hypeForge Settings Board will edit this file; until then, edit it by hand and run
#   hypeforge-placement reload
# Copied to ~/.config/hypeforge/applets/placement.toml, which is the one that is read.

# false = the applet does nothing and Sway places windows its own way.
enabled = true

# The screens in order: the first is screen 1 (the main one), as Sway names them
# (swaymsg -t get_outputs). This computer: DP-3 middle, DP-2 left, DP-1 right.
screens = ["DP-3", "DP-2", "DP-1"]

# The fill order. Spots on one screen: "fill" (the whole screen), "right" (the right half,
# beside the first window), "under-right" (the bottom of the right half). On each screen the
# spots come in that order.
order = [
  { screen = 1, spot = "fill" },          # window 1
  { screen = 1, spot = "right" },         # window 2
  { screen = 2, spot = "fill" },          # window 3
  { screen = 2, spot = "right" },         # window 4
  { screen = 3, spot = "fill" },          # window 5
  { screen = 3, spot = "right" },         # window 6
  { screen = 2, spot = "under-right" },   # window 7
  { screen = 3, spot = "under-right" },   # window 8
]
