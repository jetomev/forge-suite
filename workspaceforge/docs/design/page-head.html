<title>workspaceForge Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one reading column; each screen = a short brief, a 100-column terminal drawing, then what it decides. Same family as the grubForge 2.0 design page. */
:root {
  --bg: #f6f5fa;
  --fg: #23212e;
  --muted: #5d5a70;
  --rule: #dcd9e8;
  --panel: #ffffff;
  --accent: #6c4fc7;
  --accent-soft: #ece6fb;
  --warn-soft: #fbf1d9;
  --warn-ink: #7a5300;
  --bad-soft: #fbe3e6;
  --bad-ink: #8a1d33;
  --ok-ink: #1f6b3a;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  /* Terminal drawings use the app's own palette (Catppuccin Mocha) in both page themes. */
  --t-base: #1e1e2e; --t-mantle: #181825; --t-crust: #11111b;
  --t-s0: #313244; --t-s1: #45475a; --t-s2: #585b70; --t-ov: #7f849c;
  --t-sub: #a6adc8; --t-text: #cdd6f4; --t-blue: #89b4fa; --t-mauve: #cba6f7;
  --t-green: #a6e3a1; --t-yellow: #f9e2af; --t-red: #f38ba8; --t-peach: #fab387; --t-box: #2b4a7a;
  /* Javier's KognogOS-theme, for the theme preview */
  --k-bg: #1a1a1a; --k-fg: #cdd6f4; --k-cur: #f5e0dc; --k-pink: #f5c2e7; --k-teal: #94e2d5;
  --k-white: #bac2de; --k-bblack: #585b70; --k-bwhite: #a6adc8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15141c; --fg: #e6e3f2; --muted: #a29fb8; --rule: #2e2c3d; --panel: #1d1b27;
    --accent: #b9a3ff; --accent-soft: #2a2442; --warn-soft: #3a3020; --warn-ink: #f3d49a;
    --bad-soft: #3a1e26; --bad-ink: #f6b3c2; --ok-ink: #9fe0b2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15141c; --fg: #e6e3f2; --muted: #a29fb8; --rule: #2e2c3d; --panel: #1d1b27;
  --accent: #b9a3ff; --accent-soft: #2a2442; --warn-soft: #3a3020; --warn-ink: #f3d49a;
  --bad-soft: #3a1e26; --bad-ink: #f6b3c2; --ok-ink: #9fe0b2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.55; padding: 0 16px; }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 40px 80px; display: grid; gap: 56px; }
.wrap > * { min-width: 0; }
.prose { max-width: 68ch; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.01em; }
h2 { font-size: 27px; }
h3 { font-size: 19px; }
p { margin: 0; }
.stack { display: grid; gap: 14px; }
.eyebrow { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.lede { font-size: 19px; color: var(--muted); }
code, kbd { font-family: var(--font-mono); font-size: 0.86em; }
kbd { border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); white-space: nowrap; }
a { color: var(--accent); }
ul, ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
section { display: grid; gap: 20px; min-width: 0; }
.toc { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 15px; }
.toc a { text-decoration: none; border-bottom: 1px solid var(--rule); }
/* Terminal drawing */
.term { background: var(--t-base); color: var(--t-text); border-radius: 8px; overflow-x: auto; border: 1px solid #2c2c3e; }
.term pre { margin: 0; padding: 14px 16px; font-family: var(--font-mono); font-size: 12.6px; line-height: 1.42; white-space: pre; }
.cap { font-size: 14.5px; color: var(--muted); }
.m { color: var(--t-sub); } .d { color: var(--t-ov); } .a { color: var(--t-blue); } .v { color: var(--t-mauve); }
.ok { color: var(--t-green); } .w { color: var(--t-yellow); } .er { color: var(--t-red); } .pc { color: var(--t-peach); }
.b { font-weight: 700; } .u { text-decoration: underline; }
.hdr { background: var(--t-crust); } .bar { background: var(--t-mantle); }
.sel { background: var(--t-box); color: var(--t-text); } .fld { background: var(--t-s0); } .btn { background: var(--t-s1); color: var(--t-text); }
.pri { background: var(--t-box); color: var(--t-text); font-weight: 700; } .act { background: var(--t-box); font-weight: 700; }
.foc { background: var(--t-s0); outline: 1px solid var(--t-blue); }
/* the theme preview, drawn in Javier's KognogOS-theme */
.kt, .kg, .kbl, .kr, .ky, .kcur { background: var(--k-bg); }
.kt { color: var(--k-fg); } .kg { color: var(--t-green); } .kbl { color: var(--t-blue); font-weight: 700; }
.kr { color: var(--t-red); } .ky { color: var(--t-yellow); } .kcur { background: var(--k-cur); }
.c0 { color: var(--k-bg); } .c1 { color: var(--t-red); } .c2 { color: var(--t-green); } .c3 { color: var(--t-yellow); }
.c4 { color: var(--t-blue); } .c5 { color: var(--k-pink); } .c6 { color: var(--k-teal); } .c7 { color: var(--k-white); }
.c8 { color: var(--k-bblack); } .c15 { color: var(--k-bwhite); }
.k1a { color: var(--k-bg); text-shadow: 0 0 1px #777; } .kcd { color: var(--k-fg); } .kcu { color: var(--k-cur); }
/* Console drawing: the 8-colour Linux console */
.con { background: #000; border-color: #333; }
.con pre { color: #c0c0c0; }
.c-bl { background: #0000aa; color: #fff; } .c-cy { color: #55ffff; } .c-y { color: #ffff55; } .c-g { color: #55ff55; } .c-pri { background: #00aaaa; color: #000; }
/* Tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
tr.grp th { color: var(--accent); padding-top: 18px; }
td code { white-space: nowrap; }
/* Decisions and notes */
.decide { background: var(--accent-soft); border-radius: 10px; padding: 18px 20px; display: grid; gap: 10px; }
.decide h3 { color: var(--accent); }
.decide ol { gap: 12px; }
.rec { font-weight: 700; }
.note { background: var(--warn-soft); color: var(--warn-ink); border-radius: 8px; padding: 12px 16px; font-size: 15.5px; }
.bad { background: var(--bad-soft); color: var(--bad-ink); border-radius: 10px; padding: 16px 20px; display: grid; gap: 10px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.two > * { min-width: 0; }
.shot { margin: 0; display: grid; gap: 6px; }
.shot img { width: 100%; border-radius: 8px; border: 1px solid var(--rule); display: block; }
.shot figcaption { font-size: 14px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
