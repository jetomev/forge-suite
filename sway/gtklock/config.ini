# hypeForge — the lock screen in the Sway session: gtklock (RECIPE job 5, D-57).
# Javier, 2026-10-05: a password box that shows a dot per key, like Hyprland's, instead of
# swaylock's ring. Copied to ~/.config/gtklock/. Win + Escape locks; so does Lock Screen in
# Win + Space, and swayidle after 30 minutes untouched (sway/config).
# The look is style.css next to this file (gtklock loads it by itself).
[main]
time-format=%I:%M %p
date-format=%A, %d %B
idle-hide=true
idle-timeout=30
