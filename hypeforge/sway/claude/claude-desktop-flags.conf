# hypeForge, 2026-10-07 (Javier: URGENT): Claude Desktop on Sway kept its login in plain
# text and lost it at every restart ("safeStorage not available, tokens will not persist").
# This tells it to keep secrets in the standard secret store (the "Secret Service" interface,
# org.freedesktop.secrets). Today that is KDE's ksecretd, already running in the session;
# tomorrow it can be our own keyring (sudoForge D-61) with no change here.
# Live copy: ~/.config/claude-desktop-flags.conf (read by /usr/bin/claude-desktop at start).
--password-store=gnome-libsecret
