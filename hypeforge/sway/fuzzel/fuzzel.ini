# hypeForge — the app launcher in the Sway session (fuzzel; Javier 2026-10-04).
# Option A (sway-launcher-desktop, a list inside a terminal) felt like a terminal; fuzzel is a
# small graphical search box. Opened with Win + Space. Colours: Catppuccin Mocha until the
# KognogOS palette (Phase 12, D-46). Copied to ~/.config/sway/fuzzel/fuzzel.ini.

[main]
# Stay open when the pointer moves over a window: Sway gives focus to the window under the
# mouse, and fuzzel closed on losing it (Javier, 2026-10-05: "appears and disappears").
exit-on-keyboard-focus-loss=no
# Terminal apps (btop…) open in Alacritty: the Sway session has no $TERMINAL set
terminal=alacritty -e
font=sans:size=13
icon-theme=candy-icons
prompt="❯  "
width=40
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=10
layer=overlay

[colors]
background=1e1e2ef2
text=cdd6f4ff
prompt=a6adc8ff
input=cdd6f4ff
match=cba6f7ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=cba6f7ff
border=cdd6f4ff

[border]
width=2
# a small curve on the corners (Javier: "maybe if we can add some tiny curve… can soften the view")
radius=10
