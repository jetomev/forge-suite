# hypeForge — the look of every pop-up list (fuzzel): the launcher, Workspaces, Favorites,
# the clipboard and the notification lists. They match the bar they drop from (Javier,
# 2026-10-05): the bar's font and size, its shade, a thin border in its hover grey, straight
# corners. Catppuccin Mocha until the KognogOS palette. Copied to ~/.config/sway/fuzzel/.

[main]
# colours and the border come from the look (hypeforge-theme, D-78)
include=~/.config/hypeforge/theme/fuzzel-colors.ini
# Stay open when the pointer moves over a window: Sway gives focus to the window under the
# mouse, and fuzzel closed on losing it (Javier, 2026-10-05: "appears and disappears").
exit-on-keyboard-focus-loss=no
# Above the see-through layer that closes a list on a click elsewhere (common/hfbackdrop.py)
layer=overlay
# Terminal apps (btop…) open in Alacritty: the Sway session has no $TERMINAL set
terminal=alacritty -e
font=Noto Sans:size=11
icon-theme=candy-icons
prompt="❯  "
width=40
lines=12
horizontal-pad=14
vertical-pad=10
inner-pad=6
layer=overlay
