# hypeForge F-41 (forge-suite#23), 2026-10-07: let Chrome hand video to the NVIDIA card
# through libva-nvidia-driver (installed since May 2026). Remove this file to go back
# to decoding on the processor. Proof: chrome://gpu → "Video Decode: Hardware accelerated"
# and nvidia-smi's decoder above 0 % while a video plays.
# VaapiOnNvidiaGPUs: Chrome switches this path off on NVIDIA cards unless asked (first try
# without it, 19:45: decoder at 0 %).
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks
--ignore-gpu-blocklist
