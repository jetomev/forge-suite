# hypeForge applet 5 · Window Rules (D-47, D-53)
#
# Which windows float (above the tiled ones, centred) instead of taking a spot. Sway already
# floats windows that call themselves dialogs; these rules catch the small tools that do not.
# Win + Shift + Space floats or un-floats any window by hand.
#
# The hypeForge Settings will edit this file; until then, edit it by hand and run
#   hypeforge-rules reload
# Copied to ~/.config/hypeforge/applets/rules.toml, which is the one that is read.
# A window's names: swaymsg -t get_tree (app_id for Wayland apps; class/title for older X11 apps).

# false = no rules from hypeForge (Sway's own dialog floating stays).
enabled = true

# One block per rule. Match on any of: app_id, class, title, window_role, window_type
# (each a pattern; ^…$ = exactly). Options: sticky = true (shows on every workspace),
# size = "40 ppt 50 ppt" (percent of the screen), border = 3 (pixels), focus = true.

# ---- Older (X11) apps that label their small windows ----
[[float]]
name = "Pop-ups, bubbles and dialogs of older apps"
window_role = '^(pop-up|bubble|dialog|task_dialog|Preferences)$'

[[float]]
name = "Utility, toolbar and splash windows of older apps"
window_type = '^(dialog|utility|toolbar|splash)$'

# ---- Small tools on this computer ----
[[float]]
name = "Calculator (galculator, until our own Forge calculator; its own size)"
app_id = '^galculator$'

[[float]]
name = "Drawing on a screenshot (swappy)"
app_id = '^swappy$'

[[float]]
name = "Sound, network and Bluetooth (wiremix, nmtui, bluetui — opened from the bar)"
app_id = '^hf-(mixer|network|bluetooth)$'
# a light 3 px border, so they stand out from what is around them (Javier, 2026-10-05)
border = 3
focus = true

[[float]]
name = "Forge Suite apps (displayForge, nogForge, grubForge, alacrittyForge, bitlaForge — from the launcher)"
app_id = '^(display|nog|grub|alacritty|bitla)forge$'
border = 3
focus = true

[[float]]
name = "Passphrase windows (pinentry — the signing key, GnuPG; Javier: it opened full screen)"
class = '(?i)^pinentry'
border = 3
focus = true

[[float]]
name = "Passphrase windows (pinentry, Wayland builds)"
app_id = '(?i)^pinentry'
border = 3
focus = true

[[float]]
name = "Network Connections"
app_id = '^nm-connection-editor$'

[[float]]
name = "Print Settings"
app_id = '^system-config-printer$'

[[float]]
name = "About windows"
app_id = '^xfce4-about$'

[[float]]
name = "Password windows (ksshaskpass, polkit)"
app_id = '(ksshaskpass|polkit)'

[[float]]
name = "sudoForge's password box (every admin request: polkit and sudo -A)"
app_id = '^sudoforge$'
border = 3
focus = true

[[float]]
name = "Video in a small window (Chrome / Brave Picture-in-Picture)"
title = '^Picture[- ]in[- ][Pp]icture$'
sticky = true

[[float]]
name = "Steam's side windows (friends, news, settings)"
class = '^steam$'
title = '^(Friends List|Steam - News.*|Steam Settings|Special Offers)$'

[[float]]
name = "hypeForge Help & Keys"
app_id = '^hypeforge-help$'
size = "60 ppt 80 ppt"
border = 3
focus = true

[[float]]
name = "hypeForge Settings"          # Javier, 2026-10-07: floating and resizable, most of the screen
app_id = '^hypeforge-settings$'
size = "85 ppt 85 ppt"
border = 3
focus = true
