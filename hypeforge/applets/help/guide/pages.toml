# hypeForge Help & Keys — the pages and their tabs, in order (Javier, 2026-10-05: short tab
# names, so the menu bar fits a small window). The key chart ("Keys") always comes first;
# each page shows its guide files one after the other. `acc` = the underlined letter when the
# first one is taken (every underlined letter is a Ctrl shortcut, 2026-10-08). The hypeForge Settings reads this too.

