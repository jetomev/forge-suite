acc = "n"            # W is Workspaces
files = ["03-placement.md", "05-window-rules.md"]

[[page]]
tab = "Apps"
files = ["04-launcher.md"]

[[page]]
tab = "Tools"
files = ["07-notifications.md", "08-screenshots.md", "09-clipboard.md", "10-lock.md", "11-mc.md", "12-autostart.md", "13-sound-network.md", "14-drives.md", "15-passwords.md", "16-default-apps.md", "17-night-light.md", "18-printing.md"]

