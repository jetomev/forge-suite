# hypeForge applet 1 · Workspaces Management (D-47)
#
# Workspaces that span all three screens: switching one switches every screen together.
# The hypeForge Settings will edit this file; until then, edit it by hand and run
#   hypeforge-workspaces reload
#
# Copied to ~/.config/hypeforge/applets/workspaces.toml, which is the one that is read.

# false = the applet does nothing and Sway keeps its own one-screen workspaces.
enabled = true

# The screens in order: the first is screen 1 (the main one). Names as Sway reports them
# (swaymsg -t get_outputs). This computer: DP-3 middle, DP-2 left, DP-1 right.
screens = ["DP-3", "DP-2", "DP-1"]

# One block per workspace, in order: the first is Win + 1, the second Win + 2, and so on
# (at most 9). Add, rename, reorder or delete blocks freely.
#
# apps (F-50, #55): the apps that open on this workspace, however they are started (the
# launcher, Favorites, a terminal, Steam starting a game). Named like the launcher names them:
# the desktop-entry file name without ".desktop" (steam, google-chrome, "Sim Companies"…).
# When one opens somewhere else, it is taken here and every screen comes along; not in the
# first 30 seconds after login, so apps that start by themselves don't move you. One app, one
# workspace: if two lists name it, the first wins. An app on no list opens where you are.
# Started 2026-10-09 from the launcher's groups (scripts/seed-workspace-apps.py, once).
