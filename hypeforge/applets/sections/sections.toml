# hypeForge applet 4 · App Sections (D-47, D-52)
#
# The launcher (Win + Space) opens on a first screen: Favourites, the groups (kinds of app),
# All apps, Help & Keys. Where an app opens is NOT set here: each workspace lists its apps in
# workspaces.toml (F-50, #55; workspaceForge edits them), and the app opens there however it is
# picked. The hypeForge Settings will edit this file; until then, edit it by hand (it is read
# every time the launcher opens).
#
# Copied to ~/.config/hypeforge/applets/sections.toml, which is the one that is read.
# Apps are named by their desktop-entry name: the file name in /usr/share/applications or
# ~/.local/share/applications without ".desktop" (google-chrome, Alacritty, btop…).

# false = Win + Space opens the plain fuzzel search instead.
enabled = true

# fuzzel's look (colours, size, corners): the same file as the plain launcher
fuzzel_config = "~/.config/sway/fuzzel/fuzzel.ini"

# Always at the top of Favourites, in this order. Empty = the Favourites line is hidden.
favourites = []

# (Above the groups on purpose: written after them, the file would make it part of the last
# group.) When an app declares several kinds, the first group here that matches wins: a settings app
# that is also a "System" app is a setting; a game that also says "Network" is a game.
claim_order = ["Settings", "Games", "Multimedia", "Graphics", "Office", "Development", "Education",
               "Science", "Internet", "System", "Utilities"]

# The groups (Javier, 2026-10-08, D-64): the standard kinds of app every desktop uses — GNOME, KDE,
# XFCE, Windows' and macOS' own folders follow the same idea — so anyone who installs something
# knows where it is. An app lands where its own desktop entry says it belongs (its Categories,
# the freedesktop.org list every app ships with); a group with nothing in it is not shown.
#   name / icon   what the launcher shows
#   categories    the freedesktop.org main categories this group holds
#   apps          only for apps that declare no category (web apps, games installed by hand…)
#   other = true  the group for anything no other group claims
[[section]]
name = "Development"
icon = "applications-development"
apps = ["chrome-mjoklplbddabcmpepnokjaffbmgbkkgg-Default"]   # GitHub (web app)
categories = ["Development"]

[[section]]
name = "Education"
icon = "applications-education"
categories = ["Education"]

[[section]]
name = "Games"
icon = "applications-games"
apps = ["World_of_Warcraft_Pi5"]   # WoW (our realm): it declares no category
categories = ["Game"]

[[section]]
name = "Graphics"
icon = "applications-graphics"
categories = ["Graphics"]

[[section]]
name = "Internet"
icon = "applications-internet"
apps = ["chrome-hnpfjngllnobngcgfapefoaidbinmjnm-Default"]   # WhatsApp Web (web app)
categories = ["Network"]

[[section]]
name = "Multimedia"
icon = "applications-multimedia"
categories = ["AudioVideo", "Audio", "Video"]

[[section]]
name = "Office"
icon = "applications-office"
categories = ["Office"]

[[section]]
name = "Science"
icon = "applications-science"
categories = ["Science"]

[[section]]
name = "Settings"
icon = "preferences-system"
apps = ["hypeforge-settings"]   # the control centre first (D-63)
categories = ["Settings"]

[[section]]
name = "System"
icon = "applications-system"
categories = ["System"]

[[section]]
name = "Utilities"
icon = "applications-utilities"
categories = ["Utility"]

[[section]]
name = "Other"
icon = "applications-other"
other = true
categories = []
