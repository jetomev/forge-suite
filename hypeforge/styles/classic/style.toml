# hypeForge style · hypeForge Classic — today's look, kept as a style (Javier, D-78 B-2)
#
# The look hypeForge has had since 2026-10-04: a straight top bar with shaded areas, 2 px
# window borders and no title bars, square lists and notifications. With the KognogOS Mocha
# theme it gives back exactly today's desktop (the five tiny Mocha changes of D-73 aside).
#
# Shapes live here; colours come from the theme through the ROLES below. A role names a theme
# token ("group.key"); a role this file leaves out takes hypeforge-theme's default.

[meta]
name = "hypeForge Classic"
slug = "classic"
summary = "hypeForge's first look: the menu bar on top, Catppuccin Mocha"   # themeForge shows it
schema = 1
needs = []
better_with = ["swayfx"]   # soft corners and a shadow in the FX login
credit = "hypeForge's own look, 2026-10-04 → (D-46)."


[elements]                       # what this theme's version of each piece is (themeForge shows it; the look file picks)
bar          = "hypeForge's first bar, top"
launcher     = "the launcher list (Win)"
workspaces   = "a workspace drop-down"
taskbar      = "open windows in the middle"
datetime     = "the date and time"
tray         = "programs' icons on the right"
status_icons = "icons on the bar"
popups       = "lists under the bar"
dock         = "none"
windows      = "a thin frame"
icons        = "the colour theme's icon set"
fonts        = "JetBrainsMono Nerd Font"

[shape]                          # pixels
radius_window    = 0
radius_popup     = 0             # pop-up lists and notifications
border_window    = 2             # default_border pixel 2 (D-46)
border_popup     = 1
titlebar         = false         # border only, no title bars (D-46)
gap_inner        = 10
gap_outer        = 0

[layout]
bar_position     = "top"
wallpaper        = "theme"       # D-75; a picture the person picked wins

[roles]                          # today's colours, role by role (docs/THEME.md)
tray_icon          = "role:bar_fg_dim"   # the tray's one-colour icons: the same colour as its other icons (2026-10-17)
bar_bg           = "bar.bg"
bar_shade        = "bar.shade"
bar_fg           = "bar.fg"          # the text made for the colour band (F-68: text.primary is dark in light themes)
bar_fg_dim       = "bar.fg_dim"
bar_hover        = "surface.hover"
bar_alert        = "status.danger"   # Do Not Disturb, errors
bar_new          = "cat.blue"        # the clipboard / USB count when something is new
bar_bell         = "status.warning"  # the bell when something is new
window_focused   = "text.primary"    # today's light border on the window in use
window_unfocused = "border.subtle"
window_urgent    = "status.danger"
titlebar_bg      = "bar.bg"
title_text       = "bar.fg"          # title bars wear the band too (F-68)
title_text_dim   = "bar.fg_dim"
list_bg          = "surface.raised"   # a neutral level (in Mocha the same #262637 as the shade)
list_text        = "text.primary"
list_prompt      = "text.secondary"
list_match       = "accent.base"     # the letters you typed
list_selection   = "surface.hover"
list_selection_text = "text.primary"
list_border      = "border.subtle"
lock_bg          = "surface.base"
lock_text        = "text.primary"
lock_border      = "border.subtle"
lock_focus       = "accent.base"
lock_error       = "status.danger"
gtk_header_bg    = "bar.bg"
gtk_header_fg    = "bar.fg"
gtk_sidebar_bg   = "bar.bg"
gtk_sidebar_fg   = "bar.fg"
gtk_card_bg      = "surface.raised"

[fx]                             # the SwayFX login only (D-68): today's look, softened. Plain Sway ignores it.
corner_radius      = 12            # 8 looked stair-stepped with the 2 px frame on SwayFX; 12 reads clean (Javier, 10-10)
shadows            = true
bar_shadows        = false         # the bar sits flush on the windows: its shadow dimmed their top frame (10-10)
frame              = "quiet"       # D-80 (Javier, 10-10, look C): a quiet frame; with none (D-79) windows looked flat on the dark wallpaper
frame_width        = 2
frame_focused      = "border.subtle*2+border.strong"   # Mocha: #585b70
frame_unfocused    = "surface.overlay"                 # Mocha: #313244
gap_outer          = 0             # FX: 10 px at the edges (the inner gap) — 20 was too much (Javier, 10-10)
dim_inactive       = 0.12          # the others dimmed a little: shows the focus without a frame
shadow_blur_radius = 24
shadow_offset      = [0, 6]
shadow_opacity     = "effects.shadow_opacity"
blur               = false
animations         = false       # SwayFX #565/#569

[fonts]
ui      = "Noto Sans"
ui_size = 10
mono    = "JetBrainsMono Nerd Font"

# The theme's own wallpaper (Javier, 2026-10-11: "Rice uses our KognogOS backgrounds only, the other
# themes, assign one background topic to each, and uses the color variants"): drawn in the colour
# theme's colours, so it changes with them. hypeforge-theme makes it; themeForge's Wallpaper page shows it.
[wallpaper]
topic = "circuit"
about = "circuit board"

[bar]                            # the status pieces on the bar, one look (Javier, 2026-10-17: "inconsistent with icon size, separation, colors"); scripts/bar-spacing.py --style classic writes them into the stylesheet
font             = "Noto Sans"
icon_size        = 16            # px, every status icon (Symbols Nerd Font)
tray_size        = 22            # px, the tray apps' pictures (the bar's image pieces)
gap              = 10            # px between the drawn parts of two pieces
tray_gap         = 10            # px between two tray icons
icon_colour      = "@hf_subtext"
edge             = 0            # px at the island's two ends (0: the style's own)
