# hypeForge style · Mac OS 9 — APPROVED by Javier 2026-10-10 (review 3, D-72; M-1…M-5 as proposed)
#
# A STYLE is shapes, layout and which pieces the desktop uses. Colours never live here: every
# part names a colour ROLE from the active theme. Any theme can wear this style; Light Gray is
# the closest to Mac OS 9's Platinum. Schema: docs/research/look-2026-10/03-theme-system.md.

[meta]
name = "Mac OS 9"
slug = "mac-os-9"
summary = "A classic menu bar on top with the emblem menu, Window, Special and Help; title bars on windows"   # themeForge shows it
schema = 1
needs = []                       # plain Sway draws all of it: square windows, real title bars
better_with = []                 # SwayFX adds only the optional crisp shadow ([fx])
credit = "After Apple's Mac OS 9 (Platinum, 1999). Learned from, never copied."


[elements]                       # what this theme's version of each piece is (themeForge shows it; the look file picks)
bar          = "a menu bar on top, 26 px"
launcher     = "the emblem menu, groups as submenus"
workspaces   = "a Workspaces menu"
taskbar      = "none"
datetime     = "the time"
tray         = "programs' icons on the right"
status_icons = "icons on the menu bar"
popups       = "drop-down menus"
dock         = "none"
windows      = "title bars, centred"
icons        = "the colour theme's icon set"
fonts        = "Noto Sans Bold"

[shape]                          # pixels, at 100 % scale
radius_window    = 0             # Mac OS 9 windows are square
radius_control   = 4             # buttons
radius_popup     = 0             # menus are square, with a hard shadow
border_window    = 1             # a thin dark frame
border_popup     = 1
titlebar         = false         # floating windows only (D-110, Javier 10-17: a tiled window with a title bar "not looking nice")
titlebar_height  = 20
titlebar_align   = "center"      # title_align center
gap_inner        = 6
gap_outer        = 0             # the edges get the inner gap; Sway adds the two (Javier, 10-11: same as between windows)
bar_height       = 26            # the menu bar (Waybar needs 25+ for its pieces at 12 px)
menu_item_height = 20

[layout]
wallpaper        = "theme"       # the theme's own generated picture unless the person picked one (D-75)
bar_position     = "top"
bar_on           = "every-screen"             # the menu bar on all screens; the Application menu on each
bar_left         = ["emblem-menu", "app-name", "workspaces", "favorites", "window-menu", "special-menu", "help-menu"]
bar_right        = ["clock", "application-menu"]
control_strip    = "none"                     # dropped (Javier, 2026-10-10, D-85): its buttons live on the menu bar — one place for each thing
launcher         = "emblem-menu"              # the Apple-menu place: groups as submenus (sections.toml)
power            = "special-menu"             # Restart · Shut Down · Log Out, where Mac OS 9 kept them
clock_format     = ["%I:%M %p"]
applets          = ["menubar"]            # the menus + the app's name (look step 5)

[roles]
tray_icon          = "role:menubar_text"   # the tray's one-colour icons: the same colour as its other icons (2026-10-17)
menubar_background   = "surface.overlay"
menubar_text         = "text.primary"
menubar_line         = "border.strong"        # the line under the menu bar
menu_background      = "surface.overlay"
menu_highlight       = "accent.base"          # the item under the mouse (Platinum's highlight colour)
menu_highlight_text  = "accent.on"
menu_disabled        = "text.muted"
title_focused        = "surface.raised"
title_focused_text   = "text.primary"
title_unfocused      = "surface.base"
title_unfocused_text = "text.muted"
window_frame         = "border.strong"
window_frame_dim     = "border.subtle"

[fx]                             # SwayFX login only — optional
corner_radius      = 0
shadows            = true        # Mac OS 9's crisp drop shadow: small and hard, down-right
shadow_blur_radius = 3
shadow_offset      = [2, 2]
shadow_opacity     = 0.35
blur               = false
animations         = false

[fonts]
ui      = "Noto Sans"            # bold in the menu bar and title bars; a free Charcoal look-alike if one is found (M-4)
ui_size = 10
ui_bold = true
mono    = "JetBrainsMono Nerd Font"

# The theme's own wallpaper (Javier, 2026-10-11: "Rice uses our KognogOS backgrounds only, the other
# themes, assign one background topic to each, and uses the color variants"): drawn in the colour
# theme's colours, so it changes with them. hypeforge-theme makes it; themeForge's Wallpaper page shows it.
[wallpaper]
topic = "skyclouds"
about = "sky and clouds"

[bar]                            # the status pieces on the bar, one look (Javier, 2026-10-17: "inconsistent with icon size, separation, colors"); scripts/bar-spacing.py --style mac-os-9 writes them into the stylesheet
font             = "Noto Sans"
icon_size        = 14            # px, every status icon (Symbols Nerd Font)
tray_size        = 18            # px, the tray apps' pictures (the bar's image pieces)
gap              = 10            # px between the drawn parts of two pieces
tray_gap         = 10            # px between two tray icons
icon_colour      = "@hf_menubar_text"
edge             = 0            # px at the island's two ends (0: the style's own)
