# hypeForge style · Linux rice — APPROVED by Javier 2026-10-10 (review 5, D-75)
#
# "Ricing" is what the Linux community calls dressing a desktop up by hand: floating bars,
# big gaps, rounded see-through terminals, a wallpaper that sets the mood. This style is our
# take, built from the same pieces as the others. Colours come from the active theme (D-73).

[meta]
name = "Linux rice"
slug = "rice"
summary = "A floating bar in three areas: workspace pills, the date and alerts, the system icons (the KognogOS default)"   # themeForge shows it
schema = 1
needs = []                       # plain Sway: square windows, solid islands
better_with = ["swayfx"]         # rounded windows, see-through terminals and frosted islands
credit = "After the r/unixporn community's work, with thanks. Learned from, never copied."


[elements]                       # what this theme's version of each piece is (themeForge shows it; the look file picks)
bar          = "one floating bar in three areas, top"
launcher     = "the launcher list (Win + Space)"
workspaces   = "numbered pills, the one on screen named"
taskbar      = "none"
datetime     = "the date, time and bell in the middle; a click: alerts + calendar"
tray         = "programs' icons on the right"
status_icons = "each opens its own pop-up"
popups       = "cards under the bar"
dock         = "none"
windows      = "a bright frame on the window in use"
icons        = "the colour theme's icon set"
fonts        = "JetBrainsMono Nerd Font"

[shape]                          # pixels, at 100 % scale
radius_window    = 12
radius_island    = 12            # the floating bar
radius_area      = 8             # its three areas inside it
radius_pill      = 999           # workspace pills
radius_popup     = 14
border_window    = 2             # a bright frame on the window in use
border_island    = 2
gap_inner        = 10            # 14 until 2026-10-13 (Javier: "let's do 10")
gap_outer        = 0             # the edges get the inner gap; Sway adds the two (Javier, 10-11: same as between windows)
bar_height       = 38
bar_margin       = 10            # the islands float this far from the screen edge

[layout]
bar_position     = "top"
bar_style        = "full-three-areas"  # Javier, 2026-10-10 (after seeing Ember live): "the bar has to be full.
                                       # If it is going to be 3 sections, then between them the background
                                       # transparent so the background is visible." Full width, three solid
                                       # areas, the wallpaper showing between them
bar_on           = "every-screen"
area_left        = ["emblem", "workspace-pills"]                 # pills: numbers; the active one wide, with its name (R-2)
area_center      = ["clock", "now-playing"]
area_right       = ["cpu", "gpu", "temperature", "memory", "disk", "network", "volume", "night-light", "tray", "power"]
launcher         = "fuzzel"      # restyled: centred, rounded, a bright frame
power            = "panel-buttons"  # big round buttons over a dimmed screen (R-5)
wallpaper        = "theme"       # the theme's own generated picture (D-75: every theme, every style)

[roles]
tray_icon          = "role:module_icon"   # the tray's one-colour icons: the same colour as its other icons (2026-10-17)
island_background  = "surface.base"           # frosted on SwayFX
bar_bg             = "surface.base"           # the areas' colour (the bar itself is see-through)
bar_fg             = "text.primary"           # the text ON the areas (surface.base), not on a colour band: in
bar_fg_dim         = "text.secondary"         # light themes bar.fg is near-white (F-68, 2026-10-11)
island_border      = "band.base"
pill_active        = "band.base"
pill_active_text   = "band.on"
pill_busy          = "text.secondary"         # a workspace with windows on it
pill_empty         = "text.muted"
module_icon        = "pop.text"
window_focused     = "band.text"              # the bright frame (R-4)
window_unfocused   = "border.subtle"
terminal_background = "term.bg"               # 82 % on SwayFX, frosted
power_button_hover = "pop.base"

[fx]                             # SwayFX login only
corner_radius      = 12
shadows            = true
shadow_blur_radius = 24
shadow_offset      = [0, 6]
blur               = true        # islands, terminals, the launcher, the power menu
blur_passes        = 3
blur_radius        = 6
terminal_opacity   = 0.82        # Alacritty's own window.opacity, so the frosted wallpaper shows
default_dim_inactive = 0.08      # windows not in use dim a touch
animations         = false       # SwayFX #565/#569

[fonts]
ui      = "JetBrainsMono Nerd Font"  # rices lean on one mono font everywhere, icons included
ui_size = 10.5
mono    = "JetBrainsMono Nerd Font"

# The theme's own wallpaper (Javier, 2026-10-11: "Rice uses our KognogOS backgrounds only, the other
# themes, assign one background topic to each, and uses the color variants"): drawn in the colour
# theme's colours, so it changes with them. hypeforge-theme makes it; themeForge's Wallpaper page shows it.
# 2026-10-17 (themeForge D-12, Javier): on the Rice the Wallpaper page also offers the other styles' drawn
# topics (topic:<name>), still in the colour theme's colours; this one stays the Rice's own.
[wallpaper]
topic = "kognogos"
about = "KognogOS · Tier Aware"
