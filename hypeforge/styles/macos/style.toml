# hypeForge style · modern macOS — APPROVED by Javier 2026-10-10 (review 4, D-74; MA-1…MA-5 as proposed)
#
# A STYLE is shapes, layout and which pieces the desktop uses. Colours never live here: every
# part names a colour ROLE from the active theme (palettes v2, D-73). Any of the 25 themes can
# wear it. Schema: docs/research/look-2026-10/03-theme-system.md.

[meta]
name = "macOS"
slug = "macos"
summary = "A menu bar on top and the Dock on the main screen; Spotlight and Launchpad"   # themeForge shows it
schema = 1
needs = []                       # plain Sway: square windows, solid menu bar and Dock
better_with = ["swayfx"]         # the frosted glass, rounded windows and deep shadows are SwayFX's
credit = "After Apple's macOS (Sonoma and Sequoia). Learned from, never copied."


[elements]                       # what this theme's version of each piece is (themeForge shows it; the look file picks)
bar          = "a menu bar on top"
launcher     = "Spotlight, a wide search"
workspaces   = "a Workspaces menu"
taskbar      = "in the Dock"
datetime     = "the date and time; a click: alerts + calendar"
tray         = "programs' icons on the right"
status_icons = "one pill that opens Control Center"
popups       = "rounded drop-down menus"
dock         = "always there on the main screen, dots under open apps"
windows      = "soft windows"
icons        = "the colour theme's icon set"
fonts        = "Noto Sans"

[shape]                          # pixels, at 100 % scale
radius_window    = 12            # SwayFX corner_radius
radius_control   = 6
radius_popup     = 14            # Control Center, Spotlight, Notification Center
radius_module    = 12            # the rounded blocks inside Control Center
radius_dock      = 18
border_window    = 1
gap_inner        = 10
gap_outer        = 0             # the edges get the inner gap; Sway adds the two (Javier, 10-11: same as between windows)
bar_height       = 26            # the menu bar
dock_height      = 64
dock_icon        = 48
dock_running     = "dot"         # a small dot under apps that are open

[layout]
wallpaper        = "theme"       # the theme's own generated picture unless the person picked one (D-75)
bar_position     = "top"
bar_on           = "every-screen"
bar_left         = ["emblem-menu", "app-name", "workspaces", "favorites", "window-menu", "help-menu"]
# the status icons open Control Center (one soft pill, as on Windows 11 and KDE); no Spotlight button —
# Win (alone, D-123) is Spotlight (Javier on Windows 11's search pill: "if it is just a meme that opens the
# launcher, it is not worth it")
bar_right        = ["tray", "control-center", "clock", "notification-center"]
dock             = "bottom-center"           # the dock bar in the one Waybar, always shown (MA-1); windows tile above it
dock_on          = "main-screen"             # the middle screen of the row (D-87)
dock_items       = ["launchpad", "favorites", "running", "|", "downloads", "trash"]
spotlight        = "fuzzel"                  # today's launcher, restyled: a wide rounded search bar, centred
launcher         = "spotlight"               # Win (alone, D-123)
applets          = ["menubar", "taskbar"]    # the menu bar's menus and app name; the Dock's apps
launchpad        = "panel-grid"              # our panel (D-68): every app as a grid, groups as tabs
control_center   = "panel"
notification_center = "panel"
clock_format     = ["%a %b %d  %I:%M %p"]   # Waybar's clock has no %-d / %-I

[roles]                          # the names the engine reads (DEFAULT_ROLES in hypeforge-theme)
tray_icon          = "role:menubar_text"   # the tray's one-colour icons: the same colour as its other icons (2026-10-17)
menubar_background = "surface.raised"        # frosted on SwayFX: later, for every style (see THEME.md)
menubar_text       = "text.primary"
menubar_line       = "border.subtle"
menu_background    = "surface.raised"
menu_highlight     = "band.base"
menu_highlight_text = "band.on"
island_background  = "surface.overlay"       # the Dock
island_border      = "border.subtle"
task_running       = "text.primary"          # the dot under open apps
task_focused       = "text.primary"
pill_hover         = "surface.hover"
panel_tile_on      = "pop.base"              # Wi-Fi on, Bluetooth on: a filled tile
panel_tile_on_text = "pop.on"
panel_selected     = "band.base"
list_selection     = "band.base"             # Spotlight's chosen line
window_focused     = "window.focused"

[fx]                             # SwayFX login only
corner_radius      = 12
shadows            = true
shadow_blur_radius = 40          # macOS's deep, soft shadow
shadow_offset      = [0, 12]
shadow_opacity     = "effects.shadow_opacity"
blur               = true        # the menu bar, the Dock and every panel ("vibrancy")
blur_passes        = 3
blur_radius        = 8
bar_opacity        = 0.72
dock_opacity       = 0.62
dim_inactive       = 0.0
animations         = false       # SwayFX #565/#569

[fonts]
ui      = "Noto Sans"            # the closest free match to San Francisco's calm
ui_size = 10.5
mono    = "JetBrainsMono Nerd Font"

# The theme's own wallpaper (Javier, 2026-10-11: "Rice uses our KognogOS backgrounds only, the other
# themes, assign one background topic to each, and uses the color variants"): drawn in the colour
# theme's colours, so it changes with them. hypeforge-theme makes it; themeForge's Wallpaper page shows it.
[wallpaper]
topic = "mountains"
about = "mountains"

[bar]                            # the status pieces on the bar, one look (Javier, 2026-10-17: "inconsistent with icon size, separation, colors"); scripts/bar-spacing.py --style macos writes them into the stylesheet
font             = "Noto Sans"
icon_size        = 14            # px, every status icon (Symbols Nerd Font)
tray_size        = 18            # px, the tray apps' pictures (the bar's image pieces)
gap              = 10            # px between the drawn parts of two pieces
tray_gap         = 10            # px between two tray icons
icon_colour      = "@hf_menubar_text"
edge             = 0            # px at the island's two ends (0: the style's own)
