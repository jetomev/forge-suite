# hypeForge style · COSMIC — APPROVED by Javier 2026-10-10 (review 7, D-77; C-1…C-5 as proposed)
#
# A STYLE is shapes, layout and which pieces the desktop uses. Colours never live here: every
# part names a colour ROLE from the active theme (D-73). Dark Blue is the closest to COSMIC's
# default dark. KognogOS ships Sway only (D-56): COSMIC's look on hypeForge, no COSMIC software.

[meta]
name = "COSMIC"
slug = "cosmic"
summary = "A top panel on every screen and a dock on the main one; the App Library"   # themeForge shows it
schema = 1
needs = []                       # plain Sway: "Square" roundness, solid panel and dock
better_with = ["swayfx"]         # "Round" and "Slightly round" windows, shadows, frost
credit = "After System76's COSMIC desktop (Pop!_OS), with thanks. Learned from, never copied."


[elements]                       # what this theme's version of each piece is (themeForge shows it; the look file picks)
bar          = "a top panel on every screen"
launcher     = "a search near the top"
workspaces   = "a Workspaces button: the workspaces strip"
taskbar      = "in the dock"
datetime     = "the date and time in the middle; a click: alerts + calendar"
tray         = "programs' icons on the right"
status_icons = "each opens its own pop-up"
popups       = "small pop-ups under the panel"
dock         = "on the main screen: the App Library and your apps"
windows      = "the active hint, 3 px"
icons        = "the colour theme's icon set"
fonts        = "Noto Sans"

[shape]                          # pixels, at 100 % scale; COSMIC's three roundness choices (C-2)
roundness        = "slightly-round"          # "round" · "slightly-round" · "square"
radius_window    = { round = 16, slightly-round = 8, square = 0 }
radius_control   = { round = 999, slightly-round = 6, square = 0 }
radius_popup     = { round = 16, slightly-round = 8, square = 0 }
border_window    = 3             # the active hint (C-3): Sway's frame, 3 px, in the theme's bright
active_hint      = 3             # colour on the window in use (Sway's border width is one for all)
gap_inner        = 8
gap_outer        = 8
bar_height       = 36            # the top panel
dock_height      = 60
dock_icon        = 42

[layout]
bar_position     = "top"
bar_on           = "every-screen"
bar_left         = ["workspaces-button", "applications-button"]
bar_center       = ["clock-date"]
bar_right        = ["tray", "bluetooth", "network", "sound", "notifications", "power"]   # Javier's icon order
dock             = "bottom-center"           # panel + dock, COSMIC's default (C-1)
dock_on          = "main-screen"             # the middle screen of the row; the side screens keep their height
dock_items       = ["app-library", "favorites", "running"]
launcher         = "fuzzel-top"              # Super: the search pop-up, centred near the top (C-4)
app_library      = "panel-grid-folders"      # every app as a grid, your groups as folders (C-4)
popups           = "separate"                # each status icon its own small pop-up (C-5)
applets          = ["taskbar"]               # the dock's favorites + running apps
workspaces       = "panel-strip"             # the Workspaces button: a strip of workspace cards
wallpaper        = "theme"                   # D-75
clock_format     = ["%a %b %d  %I:%M %p"]   # Waybar's clock has no %-d / %-I (no-padding) codes

[roles]                          # the names the engine reads (DEFAULT_ROLES in hypeforge-theme)
bar_bg             = "surface.raised"         # the panel: neutral, COSMIC's solid strip
bar_fg             = "text.primary"
island_background  = "surface.raised"         # the dock
island_border      = "border.subtle"
pill_hover         = "band.soft"              # a button under the mouse
task_running       = "band.text"              # the dock's short line under open apps
task_focused       = "band.text"
window_focused     = "band.text"              # the active hint (C-3)
window_unfocused   = "surface.overlay"
panel_tile_on      = "pop.base"               # switches and sliders in the pop-ups
panel_tile_on_text = "pop.on"
panel_selected     = "band.base"              # the App Library's selected folder

[fx]                             # SwayFX login only
corner_radius      = "shape.radius_window"   # follows the roundness choice
shadows            = true
shadow_blur_radius = 28
shadow_offset      = [0, 8]
blur               = true        # panel, dock and pop-ups
blur_radius        = 6
bar_opacity        = 0.9
animations         = false       # SwayFX #565/#569

[fonts]
ui      = "Noto Sans"            # COSMIC uses Open Sans / Fira; Noto Sans is our UI face everywhere
ui_size = 10.5
mono    = "JetBrainsMono Nerd Font"
