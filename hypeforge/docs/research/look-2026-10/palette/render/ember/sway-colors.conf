# hypeForge theme Ember (ember), generated — do not edit
# include ~/.config/hypeforge/theme/sway-colors.conf   (near the top of sway/config)
set $hf_active    #ff987c
set $hf_inactive  #3b3534
set $hf_titlebar  #0e0a09
set $hf_text      #ddd6d4
set $hf_subtext   #bbb4b2
set $hf_urgent    #ea9cf7
set $hf_band      #d43a03
set $hf_band_on   #fff8f7
