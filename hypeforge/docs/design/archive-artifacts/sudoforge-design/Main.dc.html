<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sudoForge on the desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#89b4fa}a:hover{color:#b4befe}
</style>
</helmet>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; background: #11111b; font-family: 'Noto Sans', sans-serif; color: #cdd6f4">
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at 30% 40%, #1e1e2e 0%, #11111b 70%)"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; justify-content: space-between; background: #181825; font-size: 13px">
    <div style="display: flex; align-items: center; height: 100%; background: #1e1e2e; padding: 0 14px; gap: 18px">
      <div style="width: 20px; height: 20px; border-radius: 50%; background: #89b4fa"></div>
      <span><u>W</u>orkspaces</span>
      <span><u>F</u>avorites</span>
      <span style="color: #a6adc8">1. Daily</span>
    </div>
    <div style="display: flex; align-items: center; height: 100%; background: #1e1e2e; padding: 0 14px; gap: 16px; color: #a6adc8">
      <span>tray</span><span>|</span><span style="color: #cdd6f4">Tue 6 Oct · 19:40</span><span>|</span><span>bell</span>
    </div>
  </div>
  <div style="position: absolute; top: 46px; left: 12px; width: 700px; bottom: 12px; border: 2px solid #585b70; background: #1e1e2e; padding: 18px; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #a6adc8; line-height: 1.6">
    <div>~ ❯ udiskie</div>
    <div>Mounting USB stick "KINGSTON"…</div>
    <div style="color: #f9e2af">waiting for permission</div>
  </div>
  <div style="position: absolute; top: 46px; left: 724px; right: 12px; bottom: 12px; border: 2px solid #585b70; background: #1e1e2e; box-sizing: border-box; padding: 18px; font-size: 14px; color: #7f849c">Chrome</div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -48%); width: 600px; border: 2px solid #cdd6f4; background: #1e1e2e; font-family: 'JetBrains Mono', monospace; font-size: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.55)">
    <div style="background: #11111b; color: #cba6f7; padding: 8px 16px; font-weight: 700; display: flex; justify-content: space-between">
      <span>sudoForge</span><span style="color: #a6adc8; font-weight: 400">admin rights</span>
    </div>
    <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; background: #313244; margin: 14px; border: 1px solid #585b70">
      <div style="background: {{titleBg}}; color: #ffffff; font-weight: 700; font-size: 16px; text-align: center; padding: 10px 12px; line-height: 1.35; overflow-wrap: anywhere">USB drives wants admin rights</div>
      <div style="color: #cdd6f4; line-height: 1.5; text-align: center">To mount the USB stick "KINGSTON".</div>
      <div style="color: #a6adc8; font-size: 12px; text-align: center">Asked by udiskie · checked by the system (polkit)</div>
      <div aria-hidden="true" style="height: 8px"></div>
      <label for="pw-main" style="color: #a6adc8; font-size: 12px; text-align: center">Password for jetomev</label>
      <input id="pw-main" type="password" value="hunter22" style="font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #1e1e2e; color: #cdd6f4; border: 1px solid #89b4fa; padding: 8px 10px; outline: none; text-align: center">
      <div style="display: flex; justify-content: flex-end; gap: 12px">
        <button type="button" style="font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #45475a; color: #cdd6f4; border: none; padding: 8px 22px; min-height: 44px">Cancel</button>
        <button type="button" style="font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #2b4a7a; color: #cdd6f4; border: none; padding: 8px 30px; min-height: 44px; font-weight: 700">OK</button>
      </div>
    </div>
    <div style="background: #11111b; padding: 6px 16px; font-size: 12px; color: #a6adc8"><span style="color: #89b4fa">Enter</span> OK · <span style="color: #89b4fa">Esc</span> Cancel</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"titleBg":{"editor":"color","default":"#1e1e2e","options":["#1e1e2e","#181825","#262637","#2b4a7a"]},"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  renderVals() { return { titleBg: this.props.titleBg ?? '#1e1e2e' }; }
}
</script>
</body>
</html>
