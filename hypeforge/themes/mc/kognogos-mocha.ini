# KognogOS Mocha — a Midnight Commander skin for hypeForge (Javier, 2026-10-05).
#
# Catppuccin Mocha's colours (https://catppuccin.com — thank you), with the accents of the
# KognogOS emblem: blue folders, orange-peach marked files, mauve for headers and the
# selected menu item (the same mauve as the rest of the desktop). Rounded corners, like the
# lock screen and the notifications.
#
# Full colour (truecolors): mc 4.8.19+ built with S-Lang, and a terminal that sets
# COLORTERM=truecolor (Alacritty does). Install: copy to ~/.local/share/mc/skins/, then
#   mc -S kognogos-mocha                 (try it once)
#   skin=kognogos-mocha                  (keep it: ~/.config/mc/ini, [Midnight-Commander])
# The hypeForge Theme manager will do this for you later (D-59).

[skin]
    description = KognogOS Mocha
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ╭
    drighttop = ╮
    dleftbottom = ╰
    drightbottom = ╯
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[aliases]
    # Catppuccin Mocha
    Crust = #11111b
    Mantle = #181825
    Base = #1e1e2e
    Surface0 = #313244
    Surface1 = #45475a
    Surface2 = #585b70
    Overlay0 = #6c7086
    Overlay1 = #7f849c
    Subtext0 = #a6adc8
    Subtext1 = #bac2de
    Text = #cdd6f4
    Lavender = #b4befe
    Blue = #89b4fa
    Sapphire = #74c7ec
    Sky = #89dceb
    Teal = #94e2d5
    Green = #a6e3a1
    Yellow = #f9e2af
    Peach = #fab387
    Maroon = #eba0ac
    Red = #f38ba8
    Mauve = #cba6f7
    Pink = #f5c2e7
    Flamingo = #f2cdcd

    # What each part of mc wears
    Main = Base
    MainFg = Text
    Selected = Surface1
    MarkedFg = Peach
    HeaderFg = Mauve
    Dialog = Surface0
    DialogFg = Text
    DialogFocus = Mauve
    DialogFocusFg = Base
    Input = Base
    InputFg = Text
    PaleFg = Overlay0
    Bar = Mantle
    BarFg = Subtext1
    Accent = Mauve
    AccentFg = Base
    Error = Red
    ErrorFg = Base
    ErrorFocus = Maroon

[core]
    _default_ = MainFg;Main
    selected = MainFg;Selected
    marked = MarkedFg;;bold
    markselect = MarkedFg;Selected;bold
    gauge = AccentFg;Accent
    input = InputFg;Input
    inputunchanged = PaleFg;Input
    inputmark = Base;Lavender
    disabled = PaleFg;Dialog
    reverse = Base;Blue
    commandlinemark = Base;Lavender
    header = HeaderFg;;bold
    shadow = Overlay0;Crust
    frame = Surface2

[dialog]
    _default_ = DialogFg;Dialog
    dfocus = DialogFocusFg;DialogFocus
    dhotnormal = Peach;;bold
    dhotfocus = Base;DialogFocus;bold
    dtitle = Mauve;;bold
    dframe = Overlay0

[error]
    _default_ = ErrorFg;Error
    errdfocus = ErrorFg;ErrorFocus
    errdhotnormal = Crust;;bold
    errdhotfocus = Crust;ErrorFocus;bold
    errdtitle = Crust;;bold
    errdframe = Crust

[filehighlight]
    directory = Blue;;bold
    executable = Green
    symlink = Sky
    hardlink = Teal
    stalelink = Red;;bold
    device = Yellow
    special = Pink
    core = Red
    temp = Overlay1
    archive = Maroon
    doc = Lavender
    source = Teal
    media = Flamingo
    graph = Sapphire
    database = Yellow

[menu]
    _default_ = BarFg;Bar
    menusel = AccentFg;Accent;bold
    menuhot = Peach;;bold
    menuhotsel = Base;Accent;bold
    menuinactive = Subtext0;Bar
    menuframe = Surface2

[popupmenu]
    _default_ = DialogFg;Dialog
    menusel = AccentFg;Accent
    menutitle = Mauve;;bold
    menuframe = Overlay0

[buttonbar]
    hotkey = Peach;Mantle;bold
    button = Subtext1;Surface0

[statusbar]
    _default_ = BarFg;Bar

[help]
    _default_ = Text;Mantle
    helpbold = Mauve;;bold
    helpitalic = Peach;;italic
    helplink = Blue;;underline
    helpslink = Base;Blue
    helpframe = Overlay0

[editor]
    _default_ = Text;Base
    editbold = Peach;;bold
    editmarked = Text;Surface2
    editwhitespace = Surface1;Base
    editnonprintable = Red;Mantle
    editlinestate = Overlay1;Mantle
    bookmark = Base;Lavender
    bookmarkfound = Base;Yellow
    editrightmargin = Surface1;Mantle
    editbg = ;Mantle
    editframe = Surface2
    editframeactive = Mauve
    editframedrag = Peach

[viewer]
    _default_ = Text;Base
    viewbold = Mauve;;bold
    viewunderline = Blue;;underline
    viewselected = Base;Lavender
    viewframe = Surface2

[diffviewer]
    added = Text;#2c3c35
    changedline = Text;#2e3349
    changednew = Text;#3a4a40
    changed = Text;#383a52
    removed = Text;#4a2f3a
    error = ErrorFg;Error

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ░

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
