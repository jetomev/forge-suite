# hypeForge — the network menu (a click on the bar's network icon): networkmanager_dmenu drawing
# its list with fuzzel, so it looks like the other lists (Javier, 2026-10-05). Copied to
# ~/.config/networkmanager-dmenu/config.ini. Right click on the icon: nmtui, for editing.

[dmenu]
# under the bar's right end, like the clipboard and notification lists (it adds --dmenu itself)
dmenu_command = fuzzel --anchor top-right --x-margin 4 --y-margin 4 --width 46 --font "Noto Sans:size=10"
active_chars = ●
compact = True
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}   {name}   {sec}
# saved connections off: they include internal ones (lo, virbr0, tailscale0); Wi-Fi networks
# show in the scan when Wi-Fi is on
list_saved = False
prompt = Network

[dmenu_passphrase]
# the Wi-Fi password shows as dots (fuzzel --password)
obscure = True

[editor]
terminal = alacritty
gui_if_available = False

[nmdm]
rescan_delay = 5
