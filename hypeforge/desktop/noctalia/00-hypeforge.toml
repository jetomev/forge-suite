# hypeForge defaults for Noctalia, the desktop shell (D-40). Noctalia reads every *.toml in
# ~/.config/noctalia (a link into hypeForge's folder); changes made in Noctalia's Settings
# window go to ~/.local/state/noctalia/settings.toml, which loads last and always wins.
# Setting names checked against Noctalia 5.2.0 (docs/research/2026-09-30-noctalia-integration.md).

[shell]
telemetry_enabled    = false   # the "Anonymous Startup Ping": off
setup_wizard_enabled = false   # no welcome window: hypeForge has set things up already
polkit_agent         = false   # hyprpolkitagent, Hyprland's own, stays the password pop-up
launch_apps_as_systemd_services = true   # restarting Noctalia never closes your apps (uwsm)
app_icon_colorize    = false   # app icons in their own colours, not tinted grey (Javier, 2026-10-04)
app_icon_color       = "on_surface"   # used only if tinting is switched back on: the theme's text colour

[theme]
mode           = "dark"
source         = "custom"
custom_palette = "hypeForge-Mocha"

[theme.templates]
enable_builtin_templates = false   # theme.lua colours borders, title bars, the terminal and GTK

# Gives theme.lua the colours of any palette, so Noctalia's own themes colour the whole desktop.
[theme.templates.user.hypeforge_colours]
input_path  = "$XDG_CONFIG_HOME/hypeforge/noctalia/templates/colours.lua"
output_path = "$XDG_CONFIG_HOME/hypeforge/hypr/noctalia-colours.lua"

[hooks]
colors_changed = "bash ~/.config/hypeforge/bin/hypeforge-theme-sync"

[wallpaper]
directory = "/usr/share/wallpapers/kognog"
fill_mode = "crop"

[wallpaper.default]
path = "/usr/share/wallpapers/kognog/Kognog OS Semi - Logo Catpuccin Mocha.png"

# The five KognogOS themes: picking one of these wallpapers also picks its theme (D-36).
[[wallpaper.favorite]]
path = "/usr/share/wallpapers/kognog/Kognog OS Semi - Logo Catpuccin Mocha.png"
theme_mode = "dark"
palette_source = "custom"
custom_palette = "hypeForge-Mocha"

[[wallpaper.favorite]]
path = "/usr/share/wallpapers/kognog/Kognog OS Semi - Logo Black.png"
theme_mode = "dark"
palette_source = "custom"
custom_palette = "hypeForge-Black"

[[wallpaper.favorite]]
path = "/usr/share/wallpapers/kognog/Kognog OS Semi - Logo Green.png"
theme_mode = "light"
palette_source = "custom"
custom_palette = "hypeForge-Green"

[[wallpaper.favorite]]
path = "/usr/share/wallpapers/kognog/Kognog OS Semi - Logo Gray.png"
theme_mode = "dark"
palette_source = "custom"
custom_palette = "hypeForge-Gray"

[[wallpaper.favorite]]
path = "/usr/share/wallpapers/kognog/Kognog OS Semi - Logo White.png"
theme_mode = "light"
palette_source = "custom"
custom_palette = "hypeForge-White"

[bar.default]
position    = "bottom"   # along the bottom of the screen (Javier, 2026-10-01)
margin_ends = 0    # edge to edge, the full width of the screen (Javier, 2026-10-01)
radius      = 0    # square corners, flush with the screen edges
thickness   = 45   # 11 px taller than Noctalia's 34: 40 on 2026-10-01, +5 on 2026-10-04 (Javier)
start  = ["launcher", "taskbar"]   # taskbar: open apps' icons, click to switch; no workspace number (Javier, 2026-10-01)
center = []
end    = ["media", "tray", "notifications", "clipboard", "network", "bluetooth",
          "volume", "brightness", "battery", "control-center",
          "clock", "session"]   # clock near the corner, power button last, after it (Javier, 2026-10-01)

# Icons about 6 px bigger than Noctalia's own (Javier: +2 px on 2026-10-01, +4 more on 2026-10-04).
# Noctalia has no icon size in pixels, only a size multiplier per widget; 1.5 takes the ~12 px
# icons to ~18 px (measured from screenshots: power 14 -> 18 px). The clock and "Nothing Playing"
# keep their size; the text inside network and volume grows with their icons.
[widget.taskbar]
show_window_title = false
scale = 1.5
pinned_opacity = 1.0   # pinned apps that are not open at full strength, not dimmed; open ones keep their mark (Javier, 2026-10-01)

[widget.tray]
scale = 1.5
[widget.notifications]
scale = 1.5
[widget.clipboard]
scale = 1.5
[widget.network]
scale = 1.5
[widget.bluetooth]
scale = 1.5
[widget.volume]
scale = 1.5
[widget.brightness]
scale = 1.5
[widget.battery]
scale = 1.5
[widget.control-center]
scale = 1.5
[widget.session]
scale = 1.5

# The clock: 12-hour time with AM/PM, then the date (Javier, 2026-10-01). Noctalia's clock
# uses C++ time codes: %I hour 01-12, %M minutes, %p AM/PM, %a weekday, %b month, %d day.
[widget.clock]
format = "{:%I:%M %p  ·  %a %b %d}"

[lockscreen]
enabled = false   # hyprlock stays the lock screen (Javier, 2026-09-30); hypridle locks on idle

[widget.launcher]
custom_image = "/usr/share/pixmaps/kognogos.png"   # the KognogOS emblem on the launcher button (F-32)
custom_image_colorize = false
scale = 1.5    # icons about 6 px bigger, see above

# This computer's own bar settings, if it has any: every *.toml in machines/<hostname>/
# (D-28). HYPEFORGE_MACHINE is set at login by uwsm/env.
[include]
files = ["~/.config/hypeforge/machines/${HYPEFORGE_MACHINE}/"]

# Power menu. Noctalia hides its own Lock while its lock screen is off, so Lock is a
# custom entry: "lock now" for the session, which hypridle answers with hyprlock (F-35).
[[shell.session.actions]]
action  = "command"
label   = "Lock"
glyph   = "lock"
command = "loginctl lock-session"

[[shell.session.actions]]
action = "logout"

[[shell.session.actions]]
action = "suspend"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "shutdown"
